name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install ruff -r infra/ci/requirements.txt
      - name: Lint Python
        run: ruff check .
      - name: Validate contracts are YAML
        run: |
          python - <<'EOF'
          import pathlib, sys, yaml
          bad = []
          for p in pathlib.Path("contracts").rglob("*.yml"):
              try:
                  yaml.safe_load(p.read_text())
              except Exception as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) or "contracts OK")
          sys.exit(1 if bad else 0)
          EOF
      - name: Unit tests
        run: python -m pytest tests -q || [ $? -eq 5 ]  # 5 = no tests collected

  path-guard:
    # SPEC §4a: a branch "<agent>/..." may only change that agent's paths.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Check changed paths against infra/ci/ownership.yml
        run: |
          python infra/ci/path_guard.py \
            --branch "${{ github.head_ref }}" \
            --base "origin/${{ github.base_ref }}"
