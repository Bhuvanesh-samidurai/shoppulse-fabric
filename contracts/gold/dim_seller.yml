# Data contract gold.dim_seller (owner: DE2). Change = PR + version bump + Manager approval.
table: gold.dim_seller
version: 1.0.0
owner: de2
layer: gold
lakehouse: lh_gold
description: Marketplace sellers.
grain: one row per seller_id
load: merge
source: silver.seller
scd: '1'
primary_key: [seller_key]
business_key: [seller_id]
foreign_keys:
- {column: geography_key, ref: gold.dim_geography.geography_key}
unknown_member: true
columns:
- {name: seller_key, type: bigint, nullable: false, description: 'Surrogate key: xxhash64 of the business key; -1 = unknown member'}
- {name: seller_id, type: string, nullable: false}
- {name: geography_key, type: bigint, nullable: false}
- {name: _updated_at, type: timestamp, nullable: false}
- {name: _run_id, type: string, nullable: false}
partition_by: []
delta_properties: {delta.enableChangeDataFeed: true, delta.logRetentionDuration: interval 7 days, delta.deletedFileRetentionDuration: interval 2 days}
