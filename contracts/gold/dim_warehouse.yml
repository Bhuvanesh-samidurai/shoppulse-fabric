# Data contract gold.dim_warehouse (owner: DE2). Change = PR + version bump + Manager approval.
table: gold.dim_warehouse
version: 1.0.0
owner: de2
layer: gold
lakehouse: lh_gold
description: Fulfilment centres.
grain: one row per warehouse_code
load: merge
source: silver.warehouse
scd: '1'
primary_key: [warehouse_key]
business_key: [warehouse_code]
foreign_keys:
