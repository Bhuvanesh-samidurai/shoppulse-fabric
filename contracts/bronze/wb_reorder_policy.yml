- {name: material_id, type: string, nullable: false}
- {name: reorder_point, type: int, nullable: false}
- {name: safety_stock, type: int, nullable: false}
- {name: max_stock, type: int, nullable: false}
- {name: note, type: string, nullable: true}
- {name: changed_by, type: string, nullable: false, description: User UPN, pii: true}
- {name: valid_from, type: timestamp, nullable: false}
- {name: valid_to, type: timestamp, nullable: false}
partition_by: []
delta_properties: {}
retention_note: History in SQL DB temporal table wb.reorder_policy_history; query with FOR SYSTEM_TIME.
