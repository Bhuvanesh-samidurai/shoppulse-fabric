# Data contract bronze.wb_reorder_policy (owner: DE2). Change = PR + version bump + Manager approval.
table: bronze.wb_reorder_policy
version: 1.0.0
owner: de2
layer: bronze
lakehouse: lh_bronze
description: Mirrored write-back table wb.reorder_policy (current rows; history stays in the SQL DB temporal table).
grain: one row per warehouse_code, material_id
load: shortcut
source: 'Fabric SQL DB mirroring of sqldb_shop, shortcut into lh_bronze: wb.reorder_policy'
