# Data contract silver.customer (owner: DE2). Change = PR + version bump + Manager approval.
table: silver.customer
version: 1.0.0
owner: de2
layer: silver
lakehouse: lh_silver
description: Customers, pseudonymised (GDPR). Source for dim_customer SCD2.
grain: one row per customer_id (current state)
load: merge
source: bronze.shop_customer
scd: none
primary_key: &id001 [customer_id]
business_key: *id001
foreign_keys:
- {column: postal_code, ref: silver.geography.postal_code}
columns:
- {name: customer_id, type: string, nullable: false}
- {name: customer_pseudo_id, type: string, nullable: false, description: sha2(customer_unique_id + secret salt); the person across orders}
- {name: postal_code, type: string, nullable: false}
- {name: city, type: string, nullable: false}
- {name: region_code, type: string, nullable: false}
- {name: first_seen_at, type: timestamp, nullable: false}
- {name: _updated_at, type: timestamp, nullable: false}
- {name: _run_id, type: string, nullable: false, description: ops.run_log run_id}
partition_by: []
delta_properties: {delta.enableChangeDataFeed: true, delta.logRetentionDuration: interval 7 days, delta.deletedFileRetentionDuration: interval 2 days}
