# Data contract ops.run_log (owner: DE2). Change = PR + version bump + Manager approval.
table: ops.run_log
version: 1.0.0
owner: de2
layer: ops
lakehouse: lh_silver
description: One row per load run per table (written by every DE1 load).
grain: one row per run_id and target table
load: append
source: every nb_ingest_/nb_silver_/nb_gold_load_ notebook
scd: none
primary_key: &id001 [run_id, target_table]
business_key: *id001
columns:
- {name: run_id, type: string, nullable: false}
- {name: target_table, type: string, nullable: false}
- {name: notebook, type: string, nullable: false}
- {name: env_name, type: string, nullable: false}
- {name: started_at, type: timestamp, nullable: false}
- {name: ended_at, type: timestamp, nullable: true}
- {name: status, type: string, nullable: false, description: running | succeeded | failed}
- {name: rows_in, type: bigint, nullable: true}
- {name: rows_out, type: bigint, nullable: true}
- {name: rows_quarantined, type: bigint, nullable: true}
- {name: watermark, type: string, nullable: true}
- {name: error, type: string, nullable: true}
partition_by: []
delta_properties: {delta.enableChangeDataFeed: true, delta.logRetentionDuration: interval 7 days, delta.deletedFileRetentionDuration: interval 2 days}
